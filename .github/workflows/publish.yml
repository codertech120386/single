# Build the app and publish it to GitHub Container Registry on every push to the default branch.
# ghcr with the built-in GITHUB_TOKEN needs no secrets. Make the package PUBLIC once, in the repo's
# Packages settings, so Fleet donors can pull it anonymously.
name: publish
on:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fleet-scenario-single:latest
            ghcr.io/${{ github.repository_owner }}/fleet-scenario-single:${{ github.sha }}
